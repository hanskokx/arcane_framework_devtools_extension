name: arcane_framework_devtools_extension
description: "DevTools extension for arcane_framework"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.5.2

dependencies:
  arcane_framework:
    path: ../arcane_framework
  devtools_app_shared: ^0.5.0
  devtools_extensions: ^0.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.0.0
  web: ^1.1.1

dev_dependencies:
  arcane_analysis: ^1.0.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
